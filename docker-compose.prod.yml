# Déploiement production Diafarms — rejoint le réseau externe bati_network, où
# tournent déjà atelierso_postgres et atelierso-minio (partagés avec AtelierSo, base
# et bucket dédiés à Diafarms dedans — voir .env.prod.example). Aucun conteneur
# Postgres/MinIO propre à Diafarms : on ne fait que se connecter aux existants.
# Aucun port publié sur l'hôte : les autres services du serveur (reverse proxy)
# joignent l'API via le nom de conteneur diafarms_back:9093 sur bati_network.

services:
  diafarms_back:
    image: diafarms_back:latest
    container_name: diafarms_back
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    networks:
      - bati_network
    expose:
      - "9093"
    # MlApplication charge un vrai fichier .env depuis le répertoire de travail du JVM
    # (PropertySourcesPlaceholderConfigurer + loadEnv(), voir MlApplication.java) —
    # mécanisme indépendant des variables d'environnement Docker classiques. On monte
    # donc directement le .env du serveur (mêmes clés que .env.prod.example) à
    # l'emplacement où le jar s'exécute (WORKDIR /app dans le Dockerfile).
    volumes:
      - ./.env:/app/.env:ro
      - diafarms_files:/app/files

networks:
  bati_network:
    external: true
    name: bati_network

volumes:
  diafarms_files:
